name: Verify paired mobile store candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify shared source and store metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Verify the release pair
        shell: bash
        run: node scripts/mobile-release.mjs check-store-pair | tee -a "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS device build
    needs: preflight
    uses: ./.github/workflows/ios-device-check.yml

  android:
    name: Android Play bundle build
    needs: preflight
    uses: ./.github/workflows/android-play-check.yml
