name: Build mobile development apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/mobile/**', 'src/remote/**', 'mobile/**', 'scripts/build-mobile.mjs', 'vite.mobile.config.mts', '.github/workflows/mobile.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '24.15.0', package-manager-cache: false }
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm run typecheck && npm --prefix mobile run typecheck && node --import tsx --test tests/mobile/*.test.ts
      - run: npm run build:mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Build Android debug APK and unsigned release bundle
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          bash gradlew assembleDebug bundleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tpv-mobile-android-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '24.15.0', package-manager-cache: false }
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm run build:mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: Compile unsigned iOS Simulator app
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath release/mobile-ios CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator app
        run: ditto -c -k --keepParent release/mobile-ios/Build/Products/Debug-iphonesimulator/App.app release/TPV-Karaoke-Mobile-iOS-Simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tpv-mobile-ios-simulator-${{ github.sha }}
          path: release/TPV-Karaoke-Mobile-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
