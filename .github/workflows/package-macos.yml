name: Package macOS development build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-macos
  cancel-in-progress: false

jobs:
  package:
    # This standard Apple silicon image runs macOS 27, rather than assuming
    # macos-latest is the latest version of macOS.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Record native build environment
        run: |
          sw_vers
          uname -m
          node --version
          npm --version
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          test "$(uname -m)" = arm64
      - name: Install locked dependencies
        run: npm ci
      - name: Test source and branding
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/tpv-mac-tests.log"
          node scripts/verify-brand-assets.mjs
      - name: Build ad-hoc signed development DMG and ZIP packages
        run: npm run package:mac 2>&1 | tee "$RUNNER_TEMP/tpv-mac-build.log"
      - name: Verify both payloads and launch the native application
        run: node scripts/verify-mac-package.mjs 2>&1 | tee "$RUNNER_TEMP/tpv-mac-verification.log"
      - name: Save verified installers and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Proper-Karaoke-Booth-macOS-${{ github.run_id }}
          path: |
            release/Proper-Karaoke-Booth-*-mac-*.dmg
            release/Proper-Karaoke-Booth-*-mac-*.zip
            release/Proper-Karaoke-Booth-*-mac-build.json
            release/Proper-Karaoke-Booth-*-mac-verification.json
            release/Proper-Karaoke-Booth-*-mac-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tpv-mac-*.log
          if-no-files-found: ignore
          retention-days: 7
