name: Verify Android Play bundle build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  play-bundle:
    name: Build and verify AAB with a disposable key
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix mobile --no-audit --no-fund
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify signing
        run: |
          set -euo pipefail
          umask 077
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export TPV_PLAY_KEYSTORE="$RUNNER_TEMP/tpv-disposable-upload.p12"
          export TPV_PLAY_KEY_ALIAS=synthetic
          export TPV_PLAY_STORE_PASSWORD="$(openssl rand -hex 24)"
          export TPV_PLAY_KEY_PASSWORD="$TPV_PLAY_STORE_PASSWORD"
          trap 'rm -f -- "$TPV_PLAY_KEYSTORE"' EXIT
          keytool -genkeypair -alias "$TPV_PLAY_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -dname 'CN=TPV signing test only' -validity 1 -storetype PKCS12 \
            -keystore "$TPV_PLAY_KEYSTORE" -storepass:env TPV_PLAY_STORE_PASSWORD \
            -keypass:env TPV_PLAY_KEY_PASSWORD -noprompt
          node scripts/build-play-aab.mjs --execute
          echo 'Verified the Play bundle build with a disposable key. The bundle stays on this runner.'
