name: Release on version change
run-name: Release ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches: [main, master]
    paths: [package.json, package-lock.json]
  # Seed the current version once, or retry an unpublished version without a bump.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Check version change and existing releases
        id: plan
        run: node scripts/upload-booth-release.mjs plan

  windows:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      platform: win
      runner: windows-latest
      commit: ${{ needs.plan.outputs.commit }}
    secrets:
      BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}
  linux:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      platform: linux
      runner: ubuntu-24.04
      commit: ${{ needs.plan.outputs.commit }}
    secrets:
      BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}
  macos:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      platform: mac
      runner: xcode-27
      commit: ${{ needs.plan.outputs.commit }}
    secrets:
      BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}

  planning:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stage-attempt: ${{ steps.upload.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install planning dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m pip install -r scripts/planning-requirements.txt
      - name: Generate planning editions from canonical Markdown
        run: |
          python -m unittest discover -s tests/docs
          python scripts/generate-planning.py --output-dir release/planning
          node scripts/github-release.mjs planning
      - name: Stage generated planning editions on the download server
        id: upload
        env:
          BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}
          BOOTH_RELEASE_KNOWN_HOST: ${{ vars.BOOTH_RELEASE_KNOWN_HOST }}
        run: node scripts/upload-booth-release.mjs upload planning

  publish:
    needs: [plan, windows, linux, macos, planning]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Serialize publication of the same version and keep each build set isolated.
    concurrency:
      group: release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Verify and publish the complete release on the download server
        env:
          BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}
          BOOTH_RELEASE_KNOWN_HOST: ${{ vars.BOOTH_RELEASE_KNOWN_HOST }}
          WIN_STAGE_ATTEMPT: ${{ needs.windows.outputs.stage-attempt }}
          LINUX_STAGE_ATTEMPT: ${{ needs.linux.outputs.stage-attempt }}
          MAC_STAGE_ATTEMPT: ${{ needs.macos.outputs.stage-attempt }}
          PLANNING_STAGE_ATTEMPT: ${{ needs.planning.outputs.stage-attempt }}
        run: node scripts/upload-booth-release.mjs publish
