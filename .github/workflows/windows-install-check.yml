name: Rehearse Windows installation and upgrade

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Published version to install first
        default: '0.10.5'
        required: true
        type: string
      candidate:
        description: Published version to upgrade to
        default: '0.10.6'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-install:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Run the published installer, upgrade and uninstaller
        shell: pwsh
        env:
          TPV_INSTALL_BASELINE: ${{ inputs.baseline }}
          TPV_INSTALL_CANDIDATE: ${{ inputs.candidate }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Use a disposable hosted runner.' }
          $baseline = $env:TPV_INSTALL_BASELINE
          $candidate = $env:TPV_INSTALL_CANDIDATE
          if ($baseline -notmatch '^\d+\.\d+\.\d+$' -or $candidate -notmatch '^\d+\.\d+\.\d+$' -or
              [version]$baseline -ge [version]$candidate) { throw 'Provide increasing published versions.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'tpv-install-qa-app'
          $exe = Join-Path $installDir 'proper-karaoke-booth.exe'
          if (Test-Path -LiteralPath $installDir) { throw 'The QA installation path is already in use.' }
          $expectCli = [version]$candidate -ge [version]'0.10.9'
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')

          function Invoke-SilentProcess($path, $arguments) {
            $process = Start-Process -FilePath $path -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Windows installer did not finish.' }
            if ($process.ExitCode -ne 0) { throw "Windows installer exited with code $($process.ExitCode)." }
          }

          foreach ($version in @($baseline, $candidate)) {
            $base = "https://release.thepropervolume.com/booth/v$version"
            $name = "Proper-Karaoke-Booth-$version-windows-x64-setup.exe"
            $manifest = Invoke-RestMethod -TimeoutSec 30 "$base/release-manifest.json"
            $expected = @($manifest.artifacts | Where-Object { $_.file -eq $name })
            if ($manifest.version -ne $version -or $expected.Count -ne 1 -or $expected[0].sha256 -notmatch '^[a-fA-F0-9]{64}$') {
              throw 'Expected installer is missing from the public manifest.'
            }
            $installer = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -TimeoutSec 120 "$base/$name" -OutFile $installer
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected[0].sha256) { throw 'Installer checksum mismatch.' }
            $arguments = if ($version -eq $baseline) { "/currentuser /S /D=$installDir" } else { '/currentuser /S' }
            Invoke-SilentProcess $installer $arguments
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Expected installed program is missing.' }
            $mode = if ($version -eq $baseline) { 'seed' } else { 'verify' }
            node scripts/windows-install-profile-smoke.mjs $mode $exe $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          if ($expectCli) {
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (@($userPath.Split(';') | Where-Object { $_ -ieq $installDir }).Count -ne 1) { throw 'Setup did not register user PATH exactly once.' }
            $previousProcessPath = $env:Path
            try {
              $env:Path = "$previousProcessPath;$userPath"
              $launcher = Get-Command tpv-karaoke-booth -CommandType Application
              if ($launcher.Source -ine (Join-Path $installDir 'tpv-karaoke-booth.exe')) { throw 'PATH did not resolve the installed CLI.' }
              $help = & $launcher.Source --help
              if ($LASTEXITCODE -ne 0 -or ($help -join ' ') -notmatch 'Usage: tpv-karaoke-booth') { throw 'Installed CLI help failed.' }
            } finally { $env:Path = $previousProcessPath }
          }

          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -File -Filter 'Uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Expected a single registered uninstaller executable.' }
          Invoke-SilentProcess $uninstaller[0].FullName '/S'
          for ($attempt = 0; $attempt -lt 15 -and (Test-Path -LiteralPath $exe); $attempt++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw 'The installed executable remains after uninstall.' }
          if (!(Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'tpv-install-qa-profile/show.sqlite'))) { throw 'The isolated show disappeared after uninstall.' }
          if ($expectCli -and [Environment]::GetEnvironmentVariable('Path', 'User') -cne $originalUserPath) {
            throw 'Uninstall failed to restore the original user PATH.'
          }

          if ([version]$candidate -ge [version]'0.10.10') {
            # A clean, elevated install without a scope or /D option must use Program Files.
            $defaultDir = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'The Proper Volume Karaoke Booth'
            if (Test-Path -LiteralPath $defaultDir) { throw 'Default installation path is already in use.' }
            $originalMachinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            Invoke-SilentProcess $installer '/S'
            $defaultExe = Join-Path $defaultDir 'proper-karaoke-booth.exe'
            $defaultCli = Join-Path $defaultDir 'tpv-karaoke-booth.exe'
            if (!(Test-Path -LiteralPath $defaultExe -PathType Leaf) -or !(Test-Path -LiteralPath $defaultCli -PathType Leaf)) {
              throw 'Fresh setup did not install both executables in the default Program Files directory.'
            }
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            if (@($machinePath.Split(';') | Where-Object { $_ -ieq $defaultDir }).Count -ne 1) {
              throw 'Default setup did not register machine PATH exactly once.'
            }
            $help = & $defaultCli --help
            if ($LASTEXITCODE -ne 0 -or ($help -join ' ') -notmatch 'Usage: tpv-karaoke-booth') { throw 'Default CLI help failed.' }
            $uninstaller = @(Get-ChildItem -LiteralPath $defaultDir -File -Filter 'Uninstall*.exe')
            if ($uninstaller.Count -ne 1) { throw 'Expected one uninstaller in the default directory.' }
            Invoke-SilentProcess $uninstaller[0].FullName '/S'
            for ($attempt = 0; $attempt -lt 15 -and (Test-Path -LiteralPath $defaultExe); $attempt++) { Start-Sleep -Seconds 1 }
            if (Test-Path -LiteralPath $defaultExe) { throw 'Uninstall left the default executable in place.' }
            if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -cne $originalMachinePath) {
              throw 'Uninstall failed to restore the original machine PATH.'
            }
          }
