name: Build verified release packages

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      commit:
        required: true
        type: string
    outputs:
      stage-attempt:
        value: ${{ jobs.package.outputs.stage-attempt }}
    secrets:
      BOOTH_RELEASE_SSH_KEY:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      stage-attempt: ${{ steps.upload.outputs.attempt }}
    env:
      TPV_RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Verify macOS build environment
        if: inputs.platform == 'mac'
        run: |
          sw_vers
          uname -m
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          test "$(uname -m)" = arm64
      - name: Install Linux packaging and headless test libraries
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libsecret-1-0 libnotify4 libuuid1 libdrm2 libx11-xcb1 xvfb xauth dpkg fakeroot
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application, release rules and branding
        run: |
          npm run test:ci
          npm run test:release
          node scripts/verify-brand-assets.mjs
      - name: Package native platform
        run: npm run "package:$TPV_RELEASE_PLATFORM"
      - name: Verify source, payloads and packaged app
        run: node scripts/github-release.mjs platform "$TPV_RELEASE_PLATFORM"
      - name: Stage verified release assets on the download server
        id: upload
        env:
          BOOTH_RELEASE_SSH_KEY: ${{ secrets.BOOTH_RELEASE_SSH_KEY }}
          BOOTH_RELEASE_KNOWN_HOST: ${{ vars.BOOTH_RELEASE_KNOWN_HOST }}
        run: node scripts/upload-booth-release.mjs upload "$TPV_RELEASE_PLATFORM"
