<VirtualHost *:80>
    ServerName release.thepropervolume.com
    Redirect permanent / https://release.thepropervolume.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName release.thepropervolume.com
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-booth-releases/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-booth-releases/privkey.pem
    DocumentRoot /srv/tpv-booth-releases/public
    DirectoryIndex index.html
    AllowEncodedSlashes Off
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^release\.thepropervolume\.com(?::443)?$ [NC]
    RewriteRule ^ - [F]

    <Directory /srv/tpv-booth-releases/public>
        Options None
        AllowOverride None
        Require method GET HEAD
    </Directory>
    IncludeOptional /etc/apache2/tpv-booth-release-access.conf
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    Header always set Cache-Control "private, no-store"
    AddType application/octet-stream .AppImage .blockmap
    AddType application/vnd.debian.binary-package .deb
    AddType application/x-apple-diskimage .dmg
    <FilesMatch "\.(AppImage|deb|dmg|zip|exe|blockmap)$">
        Header always set Content-Disposition "attachment"
    </FilesMatch>

    LogFormat "%t %>s %D" tpv_release_private
    CustomLog ${APACHE_LOG_DIR}/tpv-booth-release-access.log tpv_release_private
    ErrorLog ${APACHE_LOG_DIR}/tpv-booth-release-error.log
</VirtualHost>
