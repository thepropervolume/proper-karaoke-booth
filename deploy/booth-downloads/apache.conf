<VirtualHost *:80>
    ServerName release.thepropervolume.com
    Redirect permanent / https://release.thepropervolume.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName release.thepropervolume.com
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-booth-releases/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-booth-releases/privkey.pem
    DocumentRoot /srv/tpv-downloads/public
    DirectoryIndex index.html
    AllowEncodedSlashes Off
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^release\.thepropervolume\.com(?::443)?$ [NC]
    RewriteRule ^ - [F]

    # Each publisher replaces its own validated alias map atomically.
    RewriteMap tpv_latest txt:/srv/tpv-booth-releases/public/.latest.map
    RewriteMap tpv_studio_latest txt:/srv/tpv-studio-releases/public/.latest.map
    RewriteRule ^/+(booth|studio)$ /$1/ [R=308,L]
    RewriteRule ^/+boothl(?:/([A-Za-z0-9._/-]*))?$ /booth/$1 [R=308,L]
    RewriteCond ${tpv_latest:$1|NOT_FOUND} !^NOT_FOUND$
    RewriteRule ^/(?:booth/)?latest/([A-Za-z0-9._-]+)$ /booth${tpv_latest:$1} [R=302,NE,L]
    RewriteCond ${tpv_studio_latest:$1|NOT_FOUND} !^NOT_FOUND$
    RewriteRule ^/studio/latest/([A-Za-z0-9._-]+)$ /studio${tpv_studio_latest:$1} [R=302,NE,L]
    # Preserve old Booth download URLs and archived release notes.
    RewriteRule ^/((?:v[0-9]+\.[0-9]+\.[0-9]+|archive)(?:/[A-Za-z0-9._/-]*)?)$ /booth/$1 [R=302,L]

    Alias /booth/ /srv/tpv-booth-releases/public/
    Alias /studio/ /srv/tpv-studio-releases/public/

    <DirectoryMatch "^/srv/(tpv-downloads|tpv-booth-releases|tpv-studio-releases)/public(?:/|$)">
        Options None
        AllowOverride None
        Require method GET HEAD
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    Header always set Cache-Control "no-store"
    AddType application/octet-stream .AppImage .blockmap .aab
    AddType application/vnd.android.package-archive .apk
    AddType application/vnd.debian.binary-package .deb
    AddType application/x-apple-diskimage .dmg
    <FilesMatch "\.(AppImage|deb|dmg|zip|exe|blockmap|apk|aab)$">
        Header always set Content-Disposition "attachment"
    </FilesMatch>

    LogFormat "%t %>s %D" tpv_release_private
    CustomLog ${APACHE_LOG_DIR}/tpv-booth-release-access.log tpv_release_private
    ErrorLog ${APACHE_LOG_DIR}/tpv-booth-release-error.log
</VirtualHost>
