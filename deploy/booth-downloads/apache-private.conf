# Install as /etc/apache2/tpv-booth-release-access.conf for restricted previews.
<Location />
    AuthType Basic
    AuthName "The Proper Volume Karaoke Booth"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/tpv-booth-release.htpasswd
    <RequireAll>
        Require method GET HEAD
        Require valid-user
    </RequireAll>
</Location>

# The release planner can check existence without reading the private manifest.
<LocationMatch "^/v[0-9]+\.[0-9]+\.[0-9]+/release-manifest\.json$">
    <RequireAll>
        Require method GET HEAD
        <RequireAny>
            Require expr "%{REQUEST_METHOD} == 'HEAD'"
            Require valid-user
        </RequireAny>
    </RequireAll>
</LocationMatch>
