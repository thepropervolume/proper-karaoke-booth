# Install as 010-tpv-queue-relay.conf. Preserve the existing catalog TLS fallback.
# Required modules: ssl, proxy, proxy_http, headers, rewrite, remoteip.
# TLS certificate issuance is separate; this file does not change DNS or certificates.
LogFormat "%t %>s %D %B" tpv_queue_private

<VirtualHost *:80>
    ServerName queue.thepropervolume.com
    <Location />
        Require all denied
    </Location>
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-queue-access.log tpv_queue_private
</VirtualHost>

<VirtualHost *:443>
    ServerName queue.thepropervolume.com
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-queue/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-queue/privkey.pem

    # Scope trust to this vhost. Never trust arbitrary client X-Forwarded-For.
    # Snapshot of the official https://www.cloudflare.com/ips-v4 and /ips-v6 lists.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^queue\.thepropervolume\.com(?::443)?$ [NC]
    RewriteRule ^ - [F]
    AllowEncodedSlashes Off
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    ProxyTimeout 40
    LimitRequestBody 2097152
    <Location />
        Require all granted
    </Location>
    # mod_remoteip processes CF-Connecting-IP before these late request edits.
    # The relay accepts one verified injected IP only from its loopback proxy.
    RequestHeader unset X-TPV-Client-IP
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Real-IP
    RequestHeader unset True-Client-IP
    RequestHeader unset CF-Connecting-IP
    RequestHeader unset CF-Connecting-IPv6
    RequestHeader set X-TPV-Client-IP "expr=%{REMOTE_ADDR}"
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    # Optional mobile build is an explicit static allowlist, separate from guest assets.
    IncludeOptional /etc/apache2/tpv-queue-mobile.conf
    ProxyPass / http://127.0.0.1:8766/ connectiontimeout=3 timeout=40 retry=0
    ProxyPassReverse / http://127.0.0.1:8766/
    # Routes and assets are whitelisted by the relay; Apache serves no filesystem root.
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-queue-access.log tpv_queue_private
</VirtualHost>
