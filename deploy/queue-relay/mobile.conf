# Include inside the queue HTTPS vhost, before its catch-all ProxyPass.
ProxyPass /app/ !
Alias /app/ /opt/tpv-queue-relay/mobile/
RedirectMatch 308 ^/app$ /app/
<Directory /opt/tpv-queue-relay/mobile/>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all denied
    <FilesMatch "^(?:index\.html|manifest\.webmanifest|service-worker\.js|youtube-player\.(?:html|js|css)|icon-(?:192|512)\.png|[A-Za-z0-9_.-]+\.(?:js|css|woff2?))$">
        Require all granted
    </FilesMatch>
    AddType application/manifest+json .webmanifest
    AddType font/woff2 .woff2
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self'; media-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    <Files youtube-player.html>
        # This public, credential-free player can be embedded by opaque native
        # WebView origins. The bridge itself checks its parent/channel; the host
        # app and all account/room pages retain their frame-ancestors restriction.
        Header always set Content-Security-Policy "default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    </Files>
</Directory>
