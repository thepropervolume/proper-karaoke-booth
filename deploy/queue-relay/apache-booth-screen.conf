# Optional read-only singer-screen vhost. Do not enable until its separate TLS
# certificate, Cloudflare hostname and relay screenOrigin setting are ready.
# Requires ssl, proxy, proxy_http, headers, rewrite and remoteip modules.
# Never log request paths, query strings, Authorization or viewer identifiers.
LogFormat "%t %>s %D %B" tpv_booth_private

<VirtualHost *:80>
    ServerName booth.thepropervolume.com
    <Location />
        Require all denied
    </Location>
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-booth-access.log tpv_booth_private
</VirtualHost>

<VirtualHost *:443>
    ServerName booth.thepropervolume.com
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-booth-screen/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-booth-screen/privkey.pem

    # Trust only Cloudflare's known proxy networks; direct-origin requests retain
    # their socket address. Keep this list in sync with the reviewed queue vhost.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^booth\.thepropervolume\.com(?::443)?$ [NC]
    RewriteRule ^ - [F,END]
    RewriteCond %{REQUEST_METHOD} !^GET$
    RewriteRule ^ - [F,END]
    RewriteCond %{QUERY_STRING} !^$
    RewriteRule ^ - [F,END]
    RewriteCond %{REQUEST_URI} !^/v1/screen-viewer\.js$
    RewriteCond %{REQUEST_URI} !^/[a-z0-9][a-z0-9-]{1,46}[a-z0-9]/screen(/frame)?$
    RewriteRule ^ - [F,END]
    AllowEncodedSlashes Off
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    ProxyTimeout 10
    LimitRequestBody 1024
    <Location />
        Require all granted
    </Location>
    RequestHeader unset X-TPV-Client-IP
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Real-IP
    RequestHeader unset True-Client-IP
    RequestHeader unset CF-Connecting-IP
    RequestHeader unset CF-Connecting-IPv6
    RequestHeader set X-TPV-Client-IP "expr=%{REMOTE_ADDR}"
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    ProxyPass / http://127.0.0.1:8766/ connectiontimeout=3 timeout=10 retry=0
    ProxyPassReverse / http://127.0.0.1:8766/
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-booth-access.log tpv_booth_private
</VirtualHost>
