[Service]
Environment=TPV_BOOTH_ACCOUNTS=yes
Environment=TPV_BOOTH_ACCOUNTS_PASSWORD_FILE=/run/tpv-queue-relay/booth-accounts.password
Environment=TPV_BOOTH_ACCOUNT_MAIL_TOKEN_FILE=/run/tpv-queue-relay/booth-account-mail.token
LoadCredential=booth-accounts.password:/etc/tpv-queue-relay/booth-accounts.password
LoadCredential=booth-account-mail.token:/etc/tpv-queue-relay/booth-account-mail.token
ExecStartPre=/usr/bin/install -m0400 %d/booth-accounts.password /run/tpv-queue-relay/booth-accounts.password
ExecStartPre=/usr/bin/install -m0400 %d/booth-account-mail.token /run/tpv-queue-relay/booth-account-mail.token