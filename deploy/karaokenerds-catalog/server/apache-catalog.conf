# Install as 000-tpv-karaoke-catalog.conf, ahead of any other TLS virtual host.
# Requires ssl, socache_shmcb, proxy, proxy_http, rewrite and headers modules.
# Do not enable the old 000-tpv-migration-default-ssl.conf (it also claims apps).
# Access logs omit URLs, queries, credentials and client addresses. Vhost error
# logging is disabled because Apache requires the original error message there.
LogFormat "%t %>s %D" tpv_catalog_private

<VirtualHost *:443>
    ServerName catalog-denied.invalid
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-apps-20261109/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-apps-20261109/privkey.pem
    <Location />
        Require all denied
    </Location>
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-catalog-access.log tpv_catalog_private
</VirtualHost>

<VirtualHost *:443>
    ServerName apps.thepropervolume.com
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/tpv-apps-20261109/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tpv-apps-20261109/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    ProxyTimeout 15
    LimitRequestBody 12288
    AllowEncodedSlashes Off
    RewriteEngine On
    # Also reject an unexpected Host when this is selected through matching TLS SNI.
    RewriteCond %{HTTP_HOST} !^apps\.thepropervolume\.com(?::443)?$ [NC]
    RewriteRule ^ - [F]
    <Location />
        Require all denied
    </Location>
    <LocationMatch "^/v1/catalog/(?:public/)?(?:tracks|status)$">
        AuthMerging Off
        Require method GET
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>
    <LocationMatch "^/v1/ratings/lookup$">
        AuthMerging Off
        Require method POST
    </LocationMatch>
    <LocationMatch "^/v1/ratings/vote$">
        AuthMerging Off
        Require method PUT
    </LocationMatch>
    # This host connects directly to the origin; REMOTE_ADDR is its socket peer.
    # Overwrite all caller forwarding claims before injecting the verified IP.
    RequestHeader unset X-TPV-Client-IP
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Real-IP
    RequestHeader unset True-Client-IP
    RequestHeader unset CF-Connecting-IP
    RequestHeader unset CF-Connecting-IPv6
    RequestHeader set X-TPV-Client-IP "expr=%{REMOTE_ADDR}"
    # Existing routes retain bearer auth; public routes reject supplied credentials.
    ProxyPassMatch "^(/v1/catalog/(?:public/)?(?:tracks|status))$" "http://127.0.0.1:8765$1" connectiontimeout=3 timeout=15
    ProxyPassMatch "^(/v1/ratings/(?:lookup|vote))$" "http://127.0.0.1:8767$1" connectiontimeout=3 timeout=15
    ErrorLog /dev/null
    CustomLog ${APACHE_LOG_DIR}/tpv-catalog-access.log tpv_catalog_private
</VirtualHost>
